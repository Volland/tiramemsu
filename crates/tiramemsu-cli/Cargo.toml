[package]
name = "tiramemsu-cli"
description = "The `tm` command line for tiramemsu files: create on SQLite or redb, inspect, query, import, export, convert and compact"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["graph-database", "sparql", "cypher", "redb", "cli"]
categories = ["database-implementations", "command-line-utilities"]
rust-version.workspace = true

[[bin]]
name = "tm"
path = "src/main.rs"

[dependencies]
# both query languages and both backends: the CLI opens whatever file it is given
tiramemsu = { workspace = true, features = ["sparql", "cypher", "redb"] }
tiramemsu-json = { workspace = true }
tm-bench = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
oxttl = { version = "0.2", features = ["rdf-12"] }
oxrdf = { version = "0.3", features = ["rdf-12"] }
serde_json = "1"

[features]
default = ["n3", "datalog"]
# `tm reason`, `tm rules put|show` and `tm materialize` (OpenSpec change
# `add-n3-reasoning`). Cargo refuses to publish a crate whose dependencies,
# optional ones included, are not on crates.io, so this crate (like the facade)
# cannot be published until `tm-n3` and eyeron are (`publish-eyeron-dependency`).
n3 = ["tiramemsu/n3", "tiramemsu-json/n3"]
# `tm datalog`, `tm check` and `tm program put|show`
# (OpenSpec change `add-datalog-engine`).
datalog = ["tiramemsu/datalog", "tiramemsu-json/datalog"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
