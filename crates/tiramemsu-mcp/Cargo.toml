[package]
name = "tiramemsu-mcp"
description = "A local stdio MCP server exposing a tiramemsu memory file as typed agent tools"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mcp", "agent-memory", "graph-database", "sqlite", "sparql"]
categories = ["database-implementations", "command-line-utilities"]
rust-version.workspace = true

[lib]
name = "tiramemsu_mcp"
path = "src/lib.rs"

[[bin]]
name = "tiramemsu-mcp"
path = "src/main.rs"

[dependencies]
# the server exposes SPARQL, Cypher and saved answers: it needs the full facade
tiramemsu = { workspace = true, features = ["sparql", "cypher"] }
tiramemsu-json = { workspace = true }
serde_json = "1"

[features]
default = ["n3", "datalog"]
# The N3 tools `reason`, `store_rules` and `materialize` (OpenSpec change
# `add-n3-reasoning`).
n3 = ["tiramemsu/n3", "tiramemsu-json/n3"]
# The Datalog tools `datalog_query`, `check_constraints`, `store_program` and
# `enforce_program` (OpenSpec changes `add-datalog-engine`, `add-datalog-constraints`).
datalog = ["tiramemsu/datalog", "tiramemsu-json/datalog"]

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
