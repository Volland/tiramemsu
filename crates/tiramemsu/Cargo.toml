[package]
name = "tiramemsu"
description = "Tiramemsu: a bitemporal, never-forget triple store on SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
tm-core = { workspace = true }
tm-rusqlite = { workspace = true }
tm-ir = { workspace = true, optional = true }
tm-exec = { workspace = true, optional = true }
tm-sparql = { workspace = true, optional = true }
tm-cypher = { workspace = true, optional = true }
lru = "0.18"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sparesults = { version = "0.3", features = ["sparql-12"] }
proptest = "1"
oxttl = { version = "0.2", features = ["rdf-12"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false
required-features = ["exec"]

[[bench]]
name = "sparql"
harness = false
required-features = ["sparql"]

[[bench]]
name = "path"
harness = false
required-features = ["exec"]

[[example]]
name = "quickstart"
required-features = ["sparql", "cypher"]

[[example]]
name = "layers_and_paths"
required-features = ["sparql", "cypher"]

[[example]]
name = "named_graphs"
required-features = ["sparql"]

[[example]]
name = "time_travel"
required-features = ["sparql"]

[[example]]
name = "triangles"
required-features = ["exec"]

# Optional query frontends (OpenSpec change `add-optional-query-frontends`). The
# default keeps the full facade. `--no-default-features` is the core tier:
# transactions, views, bundles (JSON and N-Triples), text recall, conflict review,
# bulk import and budgets, with no query engine and no parser in the dependency tree.
[features]
default = ["sparql", "cypher"]
# The shared query engine: the IR (`tm-ir`), the planner and executor (`tm-exec`),
# the path engine (`View::path*`, `tm_path`) and the LFTJ operator.
exec = ["dep:tm-ir", "dep:tm-exec"]
# The SPARQL 1.1/1.2 front end (`View::sparql`, `tm-sparql`). Until 0.2 this name
# only switched the SPARQL side of the differential suite on; it now selects the
# front end itself, and the suite runs whenever both front ends are compiled.
sparql = ["exec", "dep:tm-sparql"]
# The openCypher front end (`View::cypher`, `Db::cypher_write`, `TxCypher`, `tm-cypher`).
cypher = ["exec", "dep:tm-cypher"]

[lints]
workspace = true
