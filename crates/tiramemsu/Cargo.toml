[package]
name = "tiramemsu"
description = "Tiramemsu: a bitemporal, never-forget triple store on SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
tm-core = { workspace = true }
tm-rusqlite = { workspace = true }
tm-ir = { workspace = true }
tm-exec = { workspace = true }
tm-sparql = { workspace = true }
tm-cypher = { workspace = true }
lru = "0.18"
serde_json = "1"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
sparesults = { version = "0.3", features = ["sparql-12"] }
proptest = "1"
oxttl = { version = "0.2", features = ["rdf-12"] }
tempfile = "3"
rusqlite = { version = "0.40", features = ["bundled"] }
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "core"
harness = false

[[bench]]
name = "sparql"
harness = false

[[bench]]
name = "path"
harness = false

[features]
default = ["sparql"]
# The SPARQL side of the differential suite (`tests/differential`); without it the
# pairs are only compiled on the Cypher side and reported as pending.
sparql = []

[lints]
workspace = true
