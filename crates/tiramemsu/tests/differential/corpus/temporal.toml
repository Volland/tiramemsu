# Time syntax of both dialects (task 13.6). `superseded`: alice worksAt acme from tx 3
# (2026-09-01T10:00Z), replaced by globex in tx 7 (12:00Z); her name changed in tx 8.

[[pair]]
name = "as of tx 5"
category = "as-of-tx"
fixture = "superseded"
sparql = '''SELECT ?c FROM <urn:tiramemsu:tm:asOf/5> WHERE { v:alice v:worksAt ?c }'''
cypher = '''USE AS OF 5 MATCH (a {`@id`: 'v:alice'})-[:worksAt]->(c) RETURN c'''
columns = { c = "c" }

