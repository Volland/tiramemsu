[package]
name = "tm-cypher"
description = "Tiramemsu Cypher front end: parser adapter, semantic analysis and lowering to the query IR"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
tm-core = { workspace = true }
tm-ir = { workspace = true }
open-cypher = "=0.2.1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
chrono-tz = "0.10"
regex = "1"
serde_json = "1"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json"] }
tiramemsu = { workspace = true }
tempfile = "3"

[lints]
workspace = true
