[package]
name = "tm-bench"
description = "Tiramemsu backend benchmark harness: seeded WatDiv-style and cyclic workloads, result checks before timing, honest reports"
version.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
tiramemsu = { workspace = true, features = ["sparql", "cypher", "redb"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# The N3 reasoning scenario (`reason` module, `examples/reason.rs`). Off by
# default: eyeron is not on crates.io yet.
n3 = ["tiramemsu/n3"]

[dev-dependencies]
tempfile = "3"

[[example]]
name = "reason"
required-features = ["n3"]

[[test]]
name = "reason"
required-features = ["n3"]

[lints]
workspace = true
