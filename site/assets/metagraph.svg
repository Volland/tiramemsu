<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Metagraph: an edge that holds a subgraph, and graphs nested in graphs</title>
  <desc id="d">Left: the edge p7 enrolledIn trial3 with statement id e1. A box hangs from the edge and holds two statements, drSmith role investigator and site9 hosts p7, each tagged into e1 with sys:inGraph. Right: the graph org contains payments, which contains teamA; org also contains teamB; teamC sits outside. Each containment is a within statement.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#d2456a"/></marker>
  </defs>
  <rect width="760" height="400" rx="18" fill="#fffaf0" stroke="#ecdcc0" stroke-width="2"/>

  <g font-size="13" font-weight="700" fill="#6b5443" letter-spacing=".06em">
    <text x="32" y="40">AN EDGE THAT HOLDS A SUBGRAPH</text>
    <text x="420" y="40">GRAPHS INSIDE GRAPHS</text>
  </g>

  <!-- left: the edge -->
  <g font-size="15" fill="#2a1a10">
    <circle cx="70" cy="100" r="30" fill="#fff1d6" stroke="#3b2418" stroke-width="2.5"/>
    <text x="70" y="105" text-anchor="middle" font-weight="700">p7</text>
    <circle cx="320" cy="100" r="30" fill="#fff1d6" stroke="#3b2418" stroke-width="2.5"/>
    <text x="320" y="105" text-anchor="middle" font-weight="700">trial3</text>
    <line x1="100" y1="100" x2="288" y2="100" stroke="#3b2418" stroke-width="2.5" marker-end="url(#a)"/>
    <rect x="132" y="70" width="124" height="24" rx="12" fill="#ffe3ea" stroke="#d2456a" stroke-width="2"/>
    <text x="194" y="87" text-anchor="middle" font-size="13">enrolledIn · e1</text>
  </g>
  <!-- the container hanging from e1 -->
  <line x1="194" y1="112" x2="194" y2="160" stroke="#d2456a" stroke-width="2" stroke-dasharray="6 5"/>
  <rect x="40" y="160" width="310" height="200" rx="14" fill="#ffe3ea" stroke="#d2456a" stroke-width="2.5"/>
  <text x="56" y="184" font-size="13" font-weight="700" fill="#a8304f">GRAPH e1</text>
  <g font-size="14" fill="#2a1a10">
    <rect x="58" y="200" width="274" height="44" rx="10" fill="#fff4d8" stroke="#3b2418" stroke-width="2"/>
    <text x="195" y="227" text-anchor="middle">drSmith  role  investigator</text>
    <rect x="58" y="258" width="274" height="44" rx="10" fill="#fff4d8" stroke="#3b2418" stroke-width="2"/>
    <text x="195" y="285" text-anchor="middle">site9  hosts  p7</text>
  </g>
  <text x="195" y="338" text-anchor="middle" font-size="12.5" fill="#6b5443">each member: (eᵢ sys:inGraph e1)</text>

  <!-- right: nesting -->
  <rect x="410" y="60" width="320" height="230" rx="16" fill="#fff1d6" stroke="#3b2418" stroke-width="2.5"/>
  <text x="426" y="84" font-size="14" font-weight="700" fill="#2a1a10">org</text>
  <rect x="428" y="98" width="180" height="170" rx="14" fill="#fff4d8" stroke="#3b2418" stroke-width="2"/>
  <text x="442" y="120" font-size="14" font-weight="700" fill="#2a1a10">payments</text>
  <rect x="444" y="134" width="148" height="116" rx="12" fill="#ffe3ea" stroke="#d2456a" stroke-width="2"/>
  <text x="458" y="156" font-size="14" font-weight="700" fill="#2a1a10">teamA</text>
  <text x="458" y="190" font-size="13" fill="#2a1a10">alice owns</text>
  <text x="458" y="208" font-size="13" fill="#2a1a10">billing</text>
  <rect x="620" y="98" width="98" height="110" rx="12" fill="#ffe3ea" stroke="#d2456a" stroke-width="2"/>
  <text x="634" y="120" font-size="14" font-weight="700" fill="#2a1a10">teamB</text>
  <text x="634" y="154" font-size="13" fill="#2a1a10">bob owns</text>
  <text x="634" y="172" font-size="13" fill="#2a1a10">search</text>
  <rect x="580" y="306" width="150" height="62" rx="12" fill="#fffaf0" stroke="#c9924f" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="594" y="330" font-size="14" font-weight="700" fill="#6b5443">teamC</text>
  <text x="594" y="352" font-size="13" fill="#6b5443">outside org</text>
  <text x="420" y="330" font-size="12.5" fill="#6b5443">each box edge:</text>
  <text x="420" y="348" font-size="12.5" fill="#6b5443">(inner v:within outer)</text>
</svg>
