<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 800" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>The graft edge seen through transaction time</title>
  <defs>
    <marker id="ck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
    <marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d2456a"/></marker>
  </defs>
  <rect width="1456" height="800" fill="#fffaf0"/>

  <!-- left panel -->
  <rect x="40" y="40" width="668" height="500" rx="20" fill="#fff" stroke="#ecdcc0" stroke-width="3"/>
  <text x="70" y="84" font-size="16" font-weight="700" fill="#6b5443" letter-spacing="1.5">AS OF TX 228: BEFORE THE GRAFT</text>
  <g id="parentL">
    <g stroke="#3b2418" stroke-width="3">
      <line x1="126" y1="170" x2="214" y2="170" marker-end="url(#ck)"/>
      <line x1="266" y1="170" x2="354" y2="170" marker-end="url(#ck)"/>
      <line x1="406" y1="170" x2="494" y2="170" marker-end="url(#ck)"/>
      <circle cx="100" cy="170" r="26" fill="#ff8fa3"/><circle cx="240" cy="170" r="26" fill="#fff4d8"/>
      <circle cx="380" cy="170" r="26" fill="#ffd98a"/><circle cx="520" cy="170" r="30" fill="#e8c9a0" stroke-width="5"/>
      <line x1="546" y1="170" x2="634" y2="170" marker-end="url(#ck)"/><circle cx="660" cy="170" r="22" fill="#fff4d8"/>
    </g>
    <text x="520" y="226" text-anchor="middle" font-size="16" fill="#2a1a10" font-weight="700">subagent call</text>
  </g>
  <g stroke="#b8a58c" stroke-width="3" stroke-dasharray="7 5">
    <line x1="326" y1="380" x2="394" y2="380"/><line x1="446" y1="380" x2="514" y2="380"/><line x1="566" y1="380" x2="634" y2="380"/>
    <circle cx="300" cy="380" r="26" fill="#ff8fa3"/><circle cx="420" cy="380" r="22" fill="#fff4d8"/>
    <circle cx="540" cy="380" r="22" fill="#ffd98a"/><circle cx="660" cy="380" r="22" fill="#ffd98a"/>
  </g>
  <rect x="270" y="326" width="420" height="110" rx="16" fill="none" stroke="#c9924f" stroke-width="2" stroke-dasharray="10 7"/>
  <text x="282" y="462" font-size="17" fill="#2a1a10"><tspan font-weight="700">16 subagent events stored</tspan></text>
  <text x="282" y="488" font-size="17" fill="#6b5443">0 reachable from the parent's root</text>
  <text x="70" y="388" font-size="17" fill="#6b5443">no edge yet</text>

  <!-- right panel -->
  <rect x="748" y="40" width="668" height="500" rx="20" fill="#fff" stroke="#ecdcc0" stroke-width="3"/>
  <text x="778" y="84" font-size="16" font-weight="700" fill="#6b5443" letter-spacing="1.5">NOW: GRAFT ADDED IN TX 229</text>
  <g stroke="#3b2418" stroke-width="3">
    <line x1="834" y1="170" x2="922" y2="170" marker-end="url(#ck)"/>
    <line x1="974" y1="170" x2="1062" y2="170" marker-end="url(#ck)"/>
    <line x1="1114" y1="170" x2="1202" y2="170" marker-end="url(#ck)"/>
    <circle cx="808" cy="170" r="26" fill="#ff8fa3"/><circle cx="948" cy="170" r="26" fill="#fff4d8"/>
    <circle cx="1088" cy="170" r="26" fill="#ffd98a"/><circle cx="1228" cy="170" r="30" fill="#e8c9a0" stroke-width="5"/>
    <line x1="1254" y1="170" x2="1342" y2="170" marker-end="url(#ck)"/><circle cx="1368" cy="170" r="22" fill="#fff4d8"/>
    <line x1="1034" y1="380" x2="1102" y2="380"/><line x1="1154" y1="380" x2="1222" y2="380"/><line x1="1274" y1="380" x2="1342" y2="380"/>
    <circle cx="1008" cy="380" r="26" fill="#ff8fa3"/><circle cx="1128" cy="380" r="22" fill="#fff4d8"/>
    <circle cx="1248" cy="380" r="22" fill="#ffd98a"/><circle cx="1368" cy="380" r="22" fill="#ffd98a"/>
  </g>
  <path d="M1210 198 C1150 270 1040 290 1016 350" fill="none" stroke="#d2456a" stroke-width="5" marker-end="url(#pk)"/>
  <text x="1150" y="292" font-size="17" fill="#d2456a" font-weight="700">graft edge</text>
  <text x="990" y="462" font-size="17" fill="#2a1a10"><tspan font-weight="700">17 subagent events</tspan></text>
  <text x="990" y="488" font-size="17" fill="#6b5443">all reachable from the parent's root</text>

  <!-- clocks -->
  <rect x="40" y="572" width="1376" height="196" rx="20" fill="#fff" stroke="#ecdcc0" stroke-width="3"/>
  <text x="70" y="612" font-size="16" font-weight="700" fill="#6b5443" letter-spacing="1.5">THE GRAFT EDGE HAS TWO CLOCKS</text>
  <line x1="120" y1="700" x2="1360" y2="700" stroke="#3b2418" stroke-width="3" marker-end="url(#ck)"/>
  <g font-family="Menlo, monospace" font-size="15" fill="#6b5443" text-anchor="middle">
    <text x="240" y="728">11:34:43.455</text><text x="460" y="728">11:34:45.399</text><text x="880" y="728">11:35:24.574</text><text x="1200" y="728">later</text>
  </g>
  <g stroke="#3b2418" stroke-width="2"><line x1="240" y1="690" x2="240" y2="710"/><line x1="460" y1="690" x2="460" y2="710"/><line x1="880" y1="690" x2="880" y2="710"/><line x1="1200" y1="690" x2="1200" y2="710"/></g>
  <g font-size="16" fill="#2a1a10" text-anchor="middle">
    <text x="240" y="672">subagent called</text>
    <text x="460" y="652" font-weight="700">valid from</text><text x="460" y="672">subagent root event</text>
    <text x="880" y="672">report handed back</text>
    <text x="1200" y="652" font-weight="700" fill="#d2456a">added at (tx 229)</text><text x="1200" y="672">when the store got it</text>
  </g>
  <text x="70" y="756" font-size="15" fill="#6b5443">Live recorder: tx time ≈ hand-back. In this replay it is the load time.</text>
</svg>
