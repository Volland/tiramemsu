[package]
name = "tiramemsu-python"
description = "Python bindings for tiramemsu (PyO3)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
name = "tiramemsu_python"
crate-type = ["cdylib"]
# The module links against the Python that loads it; there is no Rust test harness.
test = false
doctest = false

[dependencies]
# `n3`: db.reason, db.rule_set_info, tx.store_rules, db.materialize
# `datalog`: db.datalog, db.datalog_reason, db.program_info, db.explain_datalog,
# db.check, tx.store_program
tiramemsu-json = { path = "../json", features = ["n3", "datalog"] }
pyo3 = { version = "0.29", features = ["abi3-py39", "extension-module"] }
serde_json = "1"

[build-dependencies]
pyo3-build-config = "0.29"

# No `[lints] workspace = true`: pyo3 macros generate `unsafe` and the workspace forbids it.
