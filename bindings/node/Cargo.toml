[package]
name = "tiramemsu-node"
description = "Node.js bindings for tiramemsu (napi-rs): a bitemporal triple store on SQLite"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

# napi macros emit unsafe blocks; do NOT inherit workspace lints here.

[lib]
crate-type = ["cdylib"]

[dependencies]
tiramemsu-json = { path = "../json" }
serde_json = "1"
napi = { version = "3", default-features = false, features = ["napi6"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
