[package]
name = "tiramemsu-json"
description = "The JSON bridge of tiramemsu: one call per operation, shared by the Node.js and Python bindings and the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# the bridge serves SPARQL, Cypher and paths: it needs the full facade
tiramemsu = { workspace = true, features = ["sparql", "cypher"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

# No `[lints] workspace = true`: the binding crates above this one expand napi and
# pyo3 macros, which generate `unsafe`, and the workspace forbids it.
