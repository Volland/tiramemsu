[package]
name = "tiramemsu-json"
description = "The JSON bridge of tiramemsu: one call per operation, shared by the Node.js and Python bindings and the MCP server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
# the bridge serves SPARQL, Cypher and paths: it needs the full facade
tiramemsu = { workspace = true, features = ["sparql", "cypher", "redb"] }
serde_json = "1"

[features]
# N3 reasoning (`reason`, `ruleSetInfo`, `storeRules`, `materialize`; OpenSpec
# change `add-n3-reasoning`). Off by default; the Node, Python and wasm
# bindings, the MCP server and the CLI turn it on.
n3 = ["tiramemsu/n3"]
# Datalog (`datalog`, `datalogReason`, `programInfo`, `explainDatalog`, `check`,
# `storeProgram`; OpenSpec change `add-datalog-engine`). Off by default; the
# Node, Python and wasm bindings, the MCP server and the CLI turn it on.
datalog = ["tiramemsu/datalog"]
# ELPI (`elpi`, `elpiCheck`, `elpiConclude`, `elpiProgramInfo`, `storeElpiProgram`,
# `enforceElpi`, `materializeElpi`; `lat.md/elpi#Own Calls`). Off by default: it
# links the native libleanelpi. Without it these ops fail with `Unsupported`.
elpi = ["tiramemsu/elpi"]

[dev-dependencies]
tempfile = "3"

[[test]]
name = "n3"
required-features = ["n3"]

[[test]]
name = "datalog"
required-features = ["datalog"]

# No `[lints] workspace = true`: the binding crates above this one expand napi and
# pyo3 macros, which generate `unsafe`, and the workspace forbids it.
