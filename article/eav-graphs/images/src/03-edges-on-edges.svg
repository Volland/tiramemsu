<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Facts about facts</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b0304a"/></marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9c8a76"/></marker>
  </defs>
  <rect width="1456" height="900" fill="#fffaf0"/>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#2a1a10">Facts about facts</text>
  <text x="60" y="102" font-size="20" fill="#6b5443">Each edge is a statement with an id. Allocation, graph and confidence are statements about that id; t_add names its transaction.</text>

  <!-- HR side -->
  <g font-size="21" font-weight="700" fill="#2a1a10" text-anchor="middle">
    <rect x="70" y="190" width="170" height="72" rx="36" fill="#ffc7d2" stroke="#3b2418" stroke-width="3"/>
    <text x="155" y="234">Ada</text>
    <rect x="520" y="190" width="190" height="72" rx="36" fill="#f6e2bf" stroke="#3b2418" stroke-width="3"/>
    <text x="615" y="234">Search</text>
  </g>
  <path d="M242 226 L516 226" stroke="#3b2418" stroke-width="3.5" marker-end="url(#ar)"/>
  <rect x="300" y="196" width="160" height="34" rx="6" fill="#fffaf0"/>
  <text x="380" y="220" font-size="19" font-weight="700" fill="#b0304a" text-anchor="middle">stmt:38 · memberOf</text>
  <text x="380" y="256" font-size="16" fill="#6b5443" text-anchor="middle">valid [2026-03-01, ∞)</text>

  <g stroke="#b0304a" stroke-width="2.5" fill="none">
    <path d="M330 270 L170 360" marker-end="url(#arR)"/>
    <path d="M380 270 L380 360" marker-end="url(#arR)"/>
    <path d="M430 270 L590 360" marker-end="url(#arR)"/>
  </g>
  <g font-size="18" font-family="Menlo, Consolas, monospace" fill="#2a1a10">
    <rect x="60" y="364" width="230" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="80" y="401">allocation 60</text>
    <rect x="300" y="364" width="170" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="318" y="401">inGraph hr</text>
    <rect x="480" y="364" width="230" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="500" y="401">t_add  tx:4</text>
  </g>
  <path d="M595 426 L595 476" stroke="#3b2418" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="440" y="480" width="310" height="118" rx="10" fill="#f3ece0" stroke="#3b2418" stroke-width="2.5"/>
  <g font-size="18" font-family="Menlo, Consolas, monospace" fill="#2a1a10">
    <text x="460" y="514" font-weight="700">tx:4</text>
    <text x="460" y="542">author  v:hr</text>
    <text x="460" y="568">source  "reorg sheet"</text>
    <text x="460" y="590" font-size="15" fill="#6b5443">instant 2026-05-04 11:00</text>
  </g>

  <!-- agent side -->
  <g font-size="21" font-weight="700" text-anchor="middle">
    <rect x="800" y="190" width="170" height="72" rx="36" fill="#ffc7d2" stroke="#3b2418" stroke-width="3"/>
    <text x="885" y="234" fill="#2a1a10">Cleo</text>
    <rect x="1220" y="190" width="190" height="72" rx="36" fill="#fffaf0" stroke="#9c8a76" stroke-width="3" stroke-dasharray="9 6"/>
    <text x="1315" y="234" fill="#6b5443">Storage</text>
  </g>
  <path d="M972 226 L1216 226" stroke="#9c8a76" stroke-width="3.5" stroke-dasharray="10 6" marker-end="url(#arG)"/>
  <rect x="1015" y="196" width="160" height="34" rx="6" fill="#fffaf0"/>
  <text x="1095" y="220" font-size="19" font-weight="700" fill="#b0304a" text-anchor="middle">stmt:43 · memberOf</text>
  <text x="1095" y="256" font-size="16" fill="#6b5443" text-anchor="middle">valid [2026-05-01, ∞)</text>
  <g stroke="#b0304a" stroke-width="2.5" fill="none">
    <path d="M1045 270 L900 360" marker-end="url(#arR)"/>
    <path d="M1095 270 L1095 360" marker-end="url(#arR)"/>
    <path d="M1145 270 L1300 360" marker-end="url(#arR)"/>
  </g>
  <g font-size="18" font-family="Menlo, Consolas, monospace" fill="#2a1a10">
    <rect x="790" y="364" width="220" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="810" y="401">confidence 0.6</text>
    <rect x="1020" y="364" width="200" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="1032" y="400" font-size="15.5">inGraph agent-notes</text>
    <rect x="1230" y="364" width="180" height="60" rx="8" fill="#fff" stroke="#b0304a" stroke-width="2.5"/>
    <text x="1248" y="401">t_add tx:5</text>
  </g>
  <path d="M1320 426 L1320 476" stroke="#3b2418" stroke-width="2.5" marker-end="url(#ar)"/>
  <rect x="1060" y="480" width="350" height="118" rx="10" fill="#f3ece0" stroke="#3b2418" stroke-width="2.5"/>
  <g font-size="18" font-family="Menlo, Consolas, monospace" fill="#2a1a10">
    <text x="1080" y="514" font-weight="700">tx:5</text>
    <text x="1080" y="542">author  v:chat-agent</text>
    <text x="1080" y="568">source  "#storage-team…"</text>
    <text x="1080" y="590" font-size="15" fill="#6b5443">instant 2026-05-06 08:30</text>
  </g>

  <!-- Datomic inset -->
  <rect x="60" y="650" width="1336" height="200" rx="12" fill="#fff" stroke="#9c8a76" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="90" y="690" font-size="20" font-weight="700" fill="#6b5443">The same allocation without statement ids: the edge becomes an entity</text>
  <g font-size="19" font-weight="700" text-anchor="middle" fill="#2a1a10">
    <rect x="110" y="730" width="150" height="60" rx="30" fill="#ffc7d2" stroke="#3b2418" stroke-width="2.5"/>
    <text x="185" y="767">:ada</text>
    <rect x="520" y="730" width="220" height="60" rx="10" fill="#f3ece0" stroke="#3b2418" stroke-width="2.5"/>
    <text x="630" y="767">membership m1</text>
    <rect x="1000" y="730" width="170" height="60" rx="30" fill="#f6e2bf" stroke="#3b2418" stroke-width="2.5"/>
    <text x="1085" y="767">:search</text>
  </g>
  <path d="M518 760 L264 760" stroke="#3b2418" stroke-width="2.5" marker-end="url(#ar)"/>
  <path d="M742 760 L996 760" stroke="#3b2418" stroke-width="2.5" marker-end="url(#ar)"/>
  <g font-size="16" font-family="Menlo, Consolas, monospace" fill="#6b5443" text-anchor="middle">
    <text x="390" y="748">:membership/person</text>
    <text x="870" y="748">:membership/team</text>
    <text x="630" y="822">:membership/allocation 60</text>
  </g>
  <text x="1196" y="756" font-size="17" fill="#6b5443">two hops; every rule</text>
  <text x="1196" y="780" font-size="17" fill="#6b5443">on memberOf changes</text>
</svg>
