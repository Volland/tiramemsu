<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 900" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Valid time in every join, transaction time in every view</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
  </defs>
  <rect width="1456" height="900" fill="#fffaf0"/>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#2a1a10">Two clocks</text>
  <text x="60" y="102" font-size="20" fill="#6b5443">Valid time runs left to right. A join keeps only the instants where all its facts hold.</text>

  <!-- axis -->
  <g stroke="#9c8a76" stroke-width="1.5" stroke-dasharray="4 6">
    <line x1="300" y1="150" x2="300" y2="560"/>
    <line x1="540" y1="150" x2="540" y2="560"/>
    <line x1="780" y1="150" x2="780" y2="560"/>
    <line x1="1020" y1="150" x2="1020" y2="560"/>
    <line x1="1260" y1="150" x2="1260" y2="560"/>
  </g>
  <g font-size="18" fill="#6b5443" text-anchor="middle">
    <text x="300" y="584">2023</text><text x="540" y="584">2024</text><text x="780" y="584">2025</text>
    <text x="1020" y="584">2026</text><text x="1260" y="584">2027</text>
  </g>
  <line x1="300" y1="560" x2="1400" y2="560" stroke="#3b2418" stroke-width="2.5" marker-end="url(#ar)"/>
  <text x="1404" y="590" font-size="17" fill="#6b5443" text-anchor="end">valid time</text>

  <!-- 1 March 2026 marker -->
  <line x1="1060" y1="140" x2="1060" y2="560" stroke="#b0304a" stroke-width="2.5"/>
  <text x="1068" y="150" font-size="16" font-weight="700" fill="#b0304a">1 Mar 2026</text>

  <g font-size="19" font-weight="700" fill="#2a1a10">
    <text x="60" y="211">Ada · storage</text>
    <text x="60" y="291">Ada · search</text>
    <text x="60" y="371">Cleo · search</text>
    <text x="60" y="471" fill="#b0304a">together(ada,</text>
    <text x="60" y="495" fill="#b0304a">cleo, search)</text>
  </g>
  <!-- bars -->
  <rect x="580" y="186" width="480" height="38" rx="6" fill="#f6e2bf" stroke="#3b2418" stroke-width="2"/>
  <text x="600" y="212" font-size="16" fill="#2a1a10">closed by supersede on 4 May</text>
  <rect x="1060" y="186" width="330" height="38" rx="6" fill="#f6e2bf" stroke="#3b2418" stroke-width="2"/>
  <text x="1076" y="212" font-size="16" fill="#2a1a10">stmt:35 · 40%   → ∞</text>
  <rect x="1060" y="266" width="330" height="38" rx="6" fill="#ffc7d2" stroke="#3b2418" stroke-width="2"/>
  <text x="1076" y="292" font-size="16" fill="#2a1a10">stmt:38 · 60%   → ∞</text>
  <rect x="880" y="346" width="510" height="38" rx="6" fill="#ffc7d2" stroke="#3b2418" stroke-width="2"/>
  <text x="896" y="372" font-size="16" fill="#2a1a10">since 1 Jun 2025   → ∞</text>
  <rect x="1060" y="456" width="330" height="44" rx="6" fill="#b0304a"/>
  <text x="1076" y="484" font-size="17" font-weight="700" fill="#fffaf0">[2026-03-01, ∞)</text>
  <rect x="578" y="232" width="440" height="26" fill="#fffaf0"/><text x="584" y="251" font-size="15" fill="#6b5443">as a set: one interval from 2024 · with @ E: two statements</text>
  <line x1="40" y1="426" x2="1400" y2="426" stroke="#e3d5c0" stroke-width="2"/>

  <!-- transaction time strip -->
  <rect x="60" y="630" width="1336" height="230" rx="12" fill="#2a1a10"/>
  <text x="90" y="670" font-size="21" font-weight="700" fill="#fffaf0">Transaction time: what the database knew</text>
  <g font-size="17" fill="#f6e2bf">
    <text x="90" y="704">tx 2 · 6 Jan: HR import</text>
    <text x="90" y="730">tx 3 · 10 Feb: promotion</text>
    <text x="90" y="756" fill="#ffc7d2" font-weight="700">tx 4 · 4 May: the 1 March split is recorded</text>
    <text x="90" y="782">tx 5 · 6 May: the agent's guess about Cleo</text>
  </g>
  <rect x="620" y="690" width="350" height="140" rx="10" fill="#3b2418" stroke="#9c8a76" stroke-width="2"/>
  <text x="640" y="722" font-size="18" font-weight="700" fill="#fffaf0">as of 1 April</text>
  <text x="640" y="752" font-size="17" font-family="Menlo, Consolas, monospace" fill="#f6e2bf">?- together(v:ada, Y, T).</text>
  <text x="640" y="782" font-size="17" font-family="Menlo, Consolas, monospace" fill="#ffc7d2">(no rows)</text>
  <text x="640" y="812" font-size="15" fill="#e3d5c0">the split was true, not yet known</text>
  <rect x="1000" y="690" width="370" height="140" rx="10" fill="#3b2418" stroke="#ffc7d2" stroke-width="2"/>
  <text x="1020" y="722" font-size="18" font-weight="700" fill="#fffaf0">now</text>
  <text x="1020" y="752" font-size="17" font-family="Menlo, Consolas, monospace" fill="#f6e2bf">?- together(v:ada, Y, T).</text>
  <text x="1020" y="782" font-size="17" font-family="Menlo, Consolas, monospace" fill="#ffc7d2">v:cleo, v:search</text>
  <text x="1020" y="806" font-size="17" font-family="Menlo, Consolas, monospace" fill="#ffc7d2">  @ [2026-03-01, inf)</text>
</svg>
