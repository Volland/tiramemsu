<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 816" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>Tiramemsu: a slice of tiramisu whose layers are a graph</title>
  <defs>
    <marker id="pk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d2456a"/></marker>
    <marker id="ck" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
    <pattern id="dust" width="18" height="14" patternUnits="userSpaceOnUse">
      <rect width="18" height="14" fill="#5a3a26"/>
      <circle cx="4" cy="4" r="1.6" fill="#7a5238"/><circle cx="13" cy="9" r="1.3" fill="#3b2418"/><circle cx="9" cy="2" r="1" fill="#8a6246"/>
    </pattern>
    <pattern id="crumb" width="26" height="22" patternUnits="userSpaceOnUse">
      <rect width="26" height="22" fill="#d9a765"/>
      <circle cx="6" cy="6" r="2" fill="#c38c4a"/><circle cx="19" cy="15" r="2.4" fill="#c9924f"/><circle cx="15" cy="4" r="1.2" fill="#b57c3c"/>
    </pattern>
  </defs>

  <rect width="1456" height="816" fill="#fffaf0"/>
  <circle cx="1330" cy="110" r="190" fill="#fff1d6"/>
  <circle cx="90" cy="760" r="160" fill="#ffe3ea"/>

  <g transform="translate(-70,10)">
  <!-- plate -->
  <ellipse cx="505" cy="690" rx="470" ry="44" fill="#ecdcc0"/>
  <ellipse cx="505" cy="680" rx="440" ry="34" fill="#fff4d8" stroke="#e2cfae" stroke-width="2"/>

  <!-- right side faces (darker) -->
  <g stroke="#3b2418" stroke-width="3" stroke-linejoin="round">
    <polygon points="800,195 890,135 890,175 800,235" fill="#3b2418"/>
    <polygon points="800,235 890,175 890,275 800,335" fill="#eadcbc"/>
    <polygon points="800,335 890,275 890,385 800,445" fill="#b98545"/>
    <polygon points="800,445 890,385 890,485 800,545" fill="#eadcbc"/>
    <polygon points="800,545 890,485 890,605 800,665" fill="#b98545"/>
  </g>
  <!-- top face -->
  <polygon points="140,195 800,195 890,135 230,135" fill="url(#dust)" stroke="#3b2418" stroke-width="3" stroke-linejoin="round"/>

  <!-- front face layers -->
  <g stroke="#3b2418" stroke-width="3">
    <rect x="140" y="195" width="660" height="40" fill="url(#dust)"/>
    <rect x="140" y="235" width="660" height="100" fill="#fff4d8"/>
    <rect x="140" y="335" width="660" height="110" fill="url(#crumb)"/>
    <rect x="140" y="445" width="660" height="100" fill="#fff4d8"/>
    <rect x="140" y="545" width="660" height="120" fill="url(#crumb)"/>
  </g>

  <!-- layer 1 · facts (bottom sponge) -->
  <g stroke="#3b2418" stroke-width="3">
    <line x1="232" y1="612" x2="440" y2="590" marker-end="url(#ck)"/>
    <line x1="486" y1="590" x2="690" y2="618" marker-end="url(#ck)"/>
    <circle cx="210" cy="614" r="22" fill="#fff"/>
    <circle cx="463" cy="588" r="22" fill="#fff"/>
    <circle cx="712" cy="620" r="22" fill="#fff"/>
    <rect x="292" y="584" width="76" height="30" rx="15" fill="#ff8fa3"/>
    <rect x="548" y="588" width="76" height="30" rx="15" fill="#ff8fa3"/>
  </g>
  <g font-size="18" font-weight="700" fill="#2a1018" text-anchor="middle">
    <text x="330" y="605">e1</text><text x="586" y="609">e2</text>
  </g>

  <!-- layer 2 · annotations (cream) -->
  <g stroke="#3b2418" stroke-width="3" fill="#fff">
    <rect x="200" y="476" width="130" height="34" rx="17"/>
    <rect x="560" y="476" width="150" height="34" rx="17"/>
  </g>
  <g font-size="18" fill="#2a1a10" text-anchor="middle">
    <text x="265" y="499">conf 0.8</text><text x="635" y="499">source</text>
  </g>
  <g stroke="#d2456a" stroke-width="3" stroke-dasharray="7 6" fill="none">
    <path d="M280 510 L318 580" marker-end="url(#pk)"/>
    <path d="M610 510 L584 584" marker-end="url(#pk)"/>
  </g>

  <!-- layer 3 · beliefs (middle sponge) -->
  <g stroke="#3b2418" stroke-width="3">
    <circle cx="420" cy="390" r="26" fill="#fff"/>
  </g>
  <text x="420" y="396" font-size="17" font-weight="700" text-anchor="middle" fill="#2a1a10">b9</text>
  <path d="M404 412 C 380 470, 360 520, 340 580" stroke="#d2456a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#pk)"/>

  <!-- layer 4 · sessions (top cream) -->
  <g stroke="#3b2418" stroke-width="3">
    <rect x="600" y="266" width="150" height="38" rx="19" fill="#fff" stroke-dasharray="8 5"/>
  </g>
  <text x="675" y="291" font-size="18" text-anchor="middle" fill="#2a1a10">session 12</text>
  <path d="M700 304 C 770 420, 760 540, 614 586" stroke="#d2456a" stroke-width="3" stroke-dasharray="7 6" fill="none" marker-end="url(#pk)"/>
  <circle cx="250" cy="285" r="24" fill="#fff" stroke="#3b2418" stroke-width="3"/>
  <text x="250" y="291" font-size="15" font-weight="700" text-anchor="middle" fill="#2a1a10">tx42</text>
  <line x1="274" y1="285" x2="410" y2="285" stroke="#3b2418" stroke-width="3" marker-end="url(#ck)"/>
  <text x="342" y="275" font-size="14" fill="#6b5443" text-anchor="middle">author</text>
  <text x="420" y="291" font-size="17" font-weight="700" fill="#2a1a10">agent 7</text>

  <!-- layer labels on the side face -->
  <g font-size="15" font-weight="700" fill="#6b5443" letter-spacing="1.5">
    <text x="905" y="164">TWO CLOCKS</text>
    <text x="905" y="235">CONTEXT</text>
    <text x="905" y="340">BELIEFS</text>
    <text x="905" y="445">ANNOTATIONS</text>
    <text x="905" y="555">FACTS</text>
  </g>

  </g>
  <!-- title -->
  <text x="1000" y="330" font-size="78" font-weight="800" fill="#3b2418">Tiramemsu</text>
  <text x="1003" y="388" font-size="31" fill="#2a1a10">Layered, bitemporal memory</text>
  <text x="1003" y="428" font-size="31" fill="#2a1a10">for AI agents</text>
  <line x1="1003" y1="462" x2="1110" y2="462" stroke="#e8607f" stroke-width="5" stroke-linecap="round"/>
  <text x="1003" y="504" font-size="22" fill="#6b5443">facts with ids · layers of belief</text>
  <text x="1003" y="536" font-size="22" fill="#6b5443">two clocks · never forget</text>
</svg>
