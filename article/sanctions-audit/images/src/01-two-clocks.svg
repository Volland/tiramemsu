<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 860" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <title>One payment, two clocks, three answers</title>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b2418"/></marker>
    <marker id="arR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b0304a"/></marker>
  </defs>
  <rect width="1456" height="860" fill="#fffaf0"/>
  <text x="60" y="66" font-size="34" font-weight="700" fill="#2a1a10">One payment, two clocks, three answers</text>
  <text x="60" y="102" font-size="20" fill="#6b5443">pay1042 to Halcyon Shipping, 3 March 2026. The designation took effect on 1 March and reached us on 5 March.</text>

  <!-- row labels -->
  <text x="60" y="176" font-size="22" font-weight="700" fill="#2a1a10">In the world</text>
  <text x="60" y="202" font-size="17" fill="#6b5443">valid time</text>
  <text x="60" y="436" font-size="22" font-weight="700" fill="#2a1a10">In our database</text>
  <text x="60" y="462" font-size="17" fill="#6b5443">transaction time</text>

  <!-- valid-time row -->
  <rect x="230" y="150" width="770" height="190" fill="#f3ece0" stroke="#ddd0bb" stroke-width="2"/>
  <rect x="729" y="168" width="271" height="70" fill="#ffc7d2" stroke="#3b2418" stroke-width="3"/>
  <text x="744" y="198" font-size="19" font-weight="700" fill="#2a1a10">Vale designated</text>
  <text x="744" y="224" font-size="16" fill="#6b5443">in force from 1 March →</text>
  <circle cx="787" cy="296" r="11" fill="#3b2418"/>
  <text x="803" y="302" font-size="18" fill="#2a1a10">pay1042, 3 Mar 10:00</text>
  <circle cx="294" cy="296" r="11" fill="#6b5443"/>
  <text x="310" y="302" font-size="18" fill="#6b5443">pay0977, 10 Feb</text>

  <!-- transaction-time row -->
  <rect x="230" y="410" width="770" height="190" fill="#f3ece0" stroke="#ddd0bb" stroke-width="2"/>
  <rect x="760" y="430" width="190" height="78" fill="#f6e2bf" stroke="#3b2418" stroke-width="3"/>
  <text x="774" y="462" font-size="18" font-weight="700" fill="#2a1a10">release recorded</text>
  <text x="774" y="488" font-size="16" fill="#6b5443">3 Mar · screened clear</text>
  <rect x="845" y="526" width="155" height="66" fill="#ffc7d2" stroke="#3b2418" stroke-width="3"/>
  <text x="858" y="555" font-size="18" font-weight="700" fill="#2a1a10">list recorded</text>
  <text x="858" y="579" font-size="16" fill="#6b5443">5 Mar 08:00</text>
  <line x1="787" y1="308" x2="787" y2="428" stroke="#3b2418" stroke-width="2" stroke-dasharray="6 5"/>
  <line x1="729" y1="240" x2="729" y2="600" stroke="#b0304a" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M735 560 L840 560" stroke="#b0304a" stroke-width="3" fill="none" marker-end="url(#arR)"/>
  <text x="718" y="566" font-size="17" font-weight="700" fill="#b0304a" text-anchor="end">104 hours late</text>

  <!-- date axis -->
  <g stroke="#3b2418" stroke-width="3" fill="none">
    <line x1="230" y1="650" x2="1010" y2="650" marker-end="url(#ar)"/>
  </g>
  <g font-size="16" fill="#2a1a10" text-anchor="middle">
    <line x1="294" y1="642" x2="294" y2="658" stroke="#3b2418" stroke-width="2"/><text x="294" y="682">10 Feb</text>
    <line x1="497" y1="642" x2="497" y2="658" stroke="#3b2418" stroke-width="2"/><text x="497" y="682">17 Feb</text>
    <line x1="729" y1="642" x2="729" y2="658" stroke="#3b2418" stroke-width="2"/><text x="722" y="682">1 Mar</text>
    <line x1="787" y1="642" x2="787" y2="658" stroke="#3b2418" stroke-width="2"/><text x="790" y="682">3 Mar</text>
    <line x1="845" y1="642" x2="845" y2="658" stroke="#3b2418" stroke-width="2"/><text x="855" y="682">5 Mar</text>
  </g>

  <!-- answers -->
  <text x="1050" y="176" font-size="22" font-weight="700" fill="#2a1a10">Ask the same question</text>
  <g>
    <rect x="1050" y="196" width="360" height="118" rx="8" fill="#e4f0dc" stroke="#3b2418" stroke-width="2.5"/>
    <text x="1068" y="228" font-size="17" font-weight="700" fill="#2a1a10">As of 3 Mar, valid on 3 Mar</text>
    <text x="1068" y="256" font-size="16" fill="#6b5443">what we knew when we decided</text>
    <text x="1068" y="292" font-size="24" font-weight="700" fill="#2f6b2a">clear</text>
    <rect x="1050" y="330" width="360" height="118" rx="8" fill="#ffc7d2" stroke="#3b2418" stroke-width="2.5"/>
    <text x="1068" y="362" font-size="17" font-weight="700" fill="#2a1a10">Now, valid on 3 Mar</text>
    <text x="1068" y="390" font-size="16" fill="#6b5443">what we know today about that day</text>
    <text x="1068" y="426" font-size="24" font-weight="700" fill="#b0304a">blocked, with 5 cited facts</text>
    <rect x="1050" y="464" width="360" height="118" rx="8" fill="#e4f0dc" stroke="#3b2418" stroke-width="2.5"/>
    <text x="1068" y="496" font-size="17" font-weight="700" fill="#2a1a10">Now, valid on 15 Feb</text>
    <text x="1068" y="524" font-size="16" fill="#6b5443">before the designation took effect</text>
    <text x="1068" y="560" font-size="24" font-weight="700" fill="#2f6b2a">clear</text>
  </g>

  <text x="60" y="760" font-size="19" fill="#2a1a10">Nothing is overwritten. The 3 March view still holds what we believed on 3 March, including the exact rule text that ran.</text>
  <text x="60" y="792" font-size="19" fill="#2a1a10">The designation is one statement with both clocks: when it held in the world, and when we learned it.</text>
</svg>
