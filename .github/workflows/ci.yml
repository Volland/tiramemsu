name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PROPTEST_CASES: "64"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the toolchain and its components
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
      - name: W3C SPARQL subset
        # fails on any unlisted failure and on any listed deviation that now passes
        run: cargo test -p tm-sparql --test w3c
      - name: Benchmarks compile
        run: cargo bench --no-run
      - name: Never-forget source audit
        # engine code never deletes or rewrites triples, terms or transactions
        # (spec never-forget "Source audit"; also tests/never_forget.rs)
        run: |
          if grep -rniE 'DELETE FROM (triple|term|tx)\b|UPDATE (term|tx)\b' crates/*/src; then
            echo "engine source issues a forbidden DELETE/UPDATE" >&2
            exit 1
          fi
      - name: tm-core has no SQLite binding
        run: |
          if cargo tree -p tm-core -e normal | grep -E 'rusqlite|libsqlite3-sys'; then
            echo "tm-core depends on a SQLite binding" >&2
            exit 1
          fi

  # The facade feature matrix (spec optional-query-frontends): for each combination,
  # the normal dependency tree (no parser where none is enabled), a check of the
  # library, tests and examples, the test suite with its runtime smoke tests, and a
  # database file handed to and from the default build. `bindings` asserts that the
  # JSON bridge, the MCP server and the bindings keep both front ends.
  features:
    strategy:
      fail-fast: false
      matrix:
        combo: [core, exec, sparql, cypher, default, bindings]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: features-${{ matrix.combo }}
      - name: Dependency tree
        run: scripts/feature-matrix.sh ${{ matrix.combo }} deps
      - name: Clippy
        if: matrix.combo != 'bindings' && matrix.combo != 'default'
        run: |
          case "${{ matrix.combo }}" in
            core) cargo clippy -p tiramemsu --all-targets --no-default-features -- -D warnings ;;
            *) cargo clippy -p tiramemsu --all-targets --no-default-features --features ${{ matrix.combo }} -- -D warnings ;;
          esac
      - name: Check
        run: scripts/feature-matrix.sh ${{ matrix.combo }} check
      - name: Tests and smoke tests
        run: scripts/feature-matrix.sh ${{ matrix.combo }} test
      - name: File handoff with the default build
        run: scripts/feature-matrix.sh ${{ matrix.combo }} handoff
      - name: Default examples run
        if: matrix.combo == 'default'
        run: |
          for e in quickstart time_travel named_graphs layers_and_paths; do
            cargo run -p tiramemsu --example "$e" > /dev/null
          done
      - name: Docs build
        if: matrix.combo == 'core'
        run: RUSTDOCFLAGS='-D warnings' cargo doc -p tiramemsu --no-deps --no-default-features

  # The language bindings over the JSON bridge (spec binding-release). Wheels and addons for
  # release are built by python-wheels.yml and npm-publish.yml.
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build, test and type-check
        working-directory: bindings/python
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install maturin pytest mypy
          maturin develop
          python -m pytest
          mypy --strict python/tiramemsu

  node:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build, test and type-check
        working-directory: bindings/node
        run: |
          npm ci
          npm run build:native
          npm run build
          npm test

  # The WASM SQLite host and binding (spec wasm-sqlite-host): clippy on wasm32,
  # the host and the JavaScript surface under Node.js (memory VFS), the native <->
  # WASM file handoff, a smoke test of the generated package, and OPFS in a
  # dedicated worker in headless Chrome.
  wasm:
    runs-on: ubuntu-latest
    env:
      WASM_BINDGEN_VERSION: "0.2.129"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wasm-bindgen-cli (the version in Cargo.lock)
        run: |
          grep -A1 'name = "wasm-bindgen"' Cargo.lock | grep -q "version = \"$WASM_BINDGEN_VERSION\""
          cargo install wasm-bindgen-cli --version "$WASM_BINDGEN_VERSION" --locked
      - name: Clippy (wasm32)
        run: cargo clippy -p tm-wasm -p tiramemsu-wasm --target wasm32-unknown-unknown --all-targets -- -D warnings
      - name: Host and binding tests under Node.js
        run: cargo test -p tm-wasm -p tiramemsu-wasm --target wasm32-unknown-unknown --tests
      - name: Native <-> WASM file handoff
        run: scripts/wasm-interop.sh
      - name: Generated package smoke test
        run: |
          cargo build -p tiramemsu-wasm --target wasm32-unknown-unknown --release
          wasm-bindgen --target nodejs --out-dir pkg target/wasm32-unknown-unknown/release/tiramemsu_wasm.wasm
          node bindings/wasm/tests/node-smoke.cjs pkg
          wasm-bindgen --target web --out-dir pkg-web target/wasm32-unknown-unknown/release/tiramemsu_wasm.wasm
      - name: OPFS in a dedicated worker (headless Chrome)
        run: |
          export CHROMEDRIVER="$CHROMEWEBDRIVER/chromedriver"
          cargo test -p tm-wasm --target wasm32-unknown-unknown --features opfs-tests --test opfs
