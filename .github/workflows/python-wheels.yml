# Builds the `tiramemsu` Python package (bindings/python) for every supported platform and
# publishes it to PyPI with trusted publishing. See docs/python-publishing.md.
#
# - A `v*` tag (the release tag) builds and publishes.
# - A manual run builds; it publishes only when `publish` is checked.
# - Wheels are abi3 (one per platform, CPython 3.9 and later); the sdist builds from source.
name: Python wheels

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to PyPI"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  wheels:
    name: wheel ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: auto, smoke: true }
          - { platform: linux-aarch64, os: ubuntu-latest, target: aarch64, manylinux: auto, smoke: false }
          - { platform: musllinux-x86_64, os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2, smoke: false }
          - { platform: macos-x86_64, os: macos-14, target: x86_64, smoke: false }
          - { platform: macos-arm64, os: macos-14, target: aarch64, smoke: true }
          - { platform: windows-x64, os: windows-latest, target: x64, smoke: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - name: Smoke test
        if: matrix.smoke
        shell: bash
        run: |
          python -m pip install --no-index --find-links bindings/python/dist tiramemsu
          python - <<'PY'
          import os, tempfile, tiramemsu
          db = tiramemsu.Database(os.path.join(tempfile.mkdtemp(), "smoke.db"))
          with db.transact() as tx:
              tx.assert_(tiramemsu.Iri("urn:a"), tiramemsu.Iri("urn:b"), tiramemsu.Iri("urn:c"))
          assert len(db.now().triples()) == 1
          print(tiramemsu.__version__)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: bindings/python/dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: bindings/python/dist

  publish:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-latest
    # The PyPI project trusts this repository, this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/tiramemsu/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
