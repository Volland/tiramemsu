[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.86"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
tm-core = { path = "crates/tm-core" }
tm-rusqlite = { path = "crates/tm-rusqlite" }
tiramemsu = { path = "crates/tiramemsu" }
tm-ir = { path = "crates/tm-ir" }
tm-exec = { path = "crates/tm-exec" }
tm-sparql = { path = "crates/tm-sparql" }
tm-cypher = { path = "crates/tm-cypher" }
