[workspace]
resolver = "2"
members = ["crates/*", "bindings/json", "bindings/node", "bindings/python", "bindings/wasm"]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.88"
authors = ["Volodymyr Pavlyshyn"]
repository = "https://github.com/Volland/tiramemsu"
homepage = "https://github.com/Volland/tiramemsu"
keywords = ["graph-database", "sqlite", "sparql", "cypher", "agent-memory"]
categories = ["database-implementations"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
tm-core = { path = "crates/tm-core", version = "0.3.0" }
tm-rusqlite = { path = "crates/tm-rusqlite", version = "0.3.0" }
tiramemsu = { path = "crates/tiramemsu", version = "0.3.0" }
tm-ir = { path = "crates/tm-ir", version = "0.3.0" }
tm-exec = { path = "crates/tm-exec", version = "0.3.0" }
tm-sparql = { path = "crates/tm-sparql", version = "0.3.0" }
tm-cypher = { path = "crates/tm-cypher", version = "0.3.0" }
tiramemsu-json = { path = "bindings/json", version = "0.3.0" }
tiramemsu-mcp = { path = "crates/tiramemsu-mcp", version = "0.3.0" }
tm-wasm = { path = "crates/tm-wasm", version = "0.3.0" }
